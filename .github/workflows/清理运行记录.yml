script: |
            // 保留记录条数
            const keepMinimumRuns = 5;
            const sleep = (ms) => new Promise((resolve) => setTimeout(resolve, ms));

            const repos = await github.paginate(github.rest.repos.listForAuthenticatedUser, {
              visibility: 'all',
              affiliation: 'owner',
              per_page: 100
            });

            console.log(`获取到 ${repos.length} 个仓库，开始依次检查与清理...`);

            for (const repo of repos) {
              const owner = repo.owner.login;
              const repoName = repo.name;
              console.log(`\n🔍 正在检查仓库: ${owner}/${repoName}`);

              // 【清理 Actions 缓存】
              try {
                const caches = await github.rest.actions.getActionsCacheList({ owner: owner, repo: repoName });
                if (caches.data.actions_caches && caches.data.actions_caches.length > 0) {
                  for (const cache of caches.data.actions_caches) {
                    await github.rest.actions.deleteActionsCacheById({ owner: owner, repo: repoName, cache_id: cache.id });
                  }
                }
              } catch (err) {}

              let deletedInRepo = 0;
              let failedIds = new Set(); // 记录本次已经删除失败的 ID，防止死循环

              while (true) {
                let response;
                try {
                  response = await github.rest.actions.listWorkflowRunsForRepo({
                    owner: owner,
                    repo: repoName,
                    per_page: 100,
                    page: 1
                  });
                } catch (err) {
                  break;
                }

                const runs = response.data.workflow_runs;
                // 过滤掉已经尝试过但删除失败的记录，防止无限重复触发
                const runsToDelete = runs ? runs.slice(keepMinimumRuns).filter(run => !failedIds.has(run.id)) : [];

                if (!runs || runs.length <= keepMinimumRuns || runsToDelete.length === 0) {
                  break;
                }

                let successCount = 0;
                for (const run of runsToDelete) {
                  try {
                    await github.rest.actions.deleteWorkflowRun({
                      owner: owner,
                      repo: repoName,
                      run_id: run.id
                    });
                    deletedInRepo++;
                    successCount++;
                    console.log(`  └─ [${deletedInRepo}] 已删除 ID: ${run.id} (${run.name})`);
                    await sleep(200);
                  } catch (err) {
                    console.error(`  └─ 删除失败 ${run.id}:`, err.message);
                    failedIds.add(run.id); // 标记该 ID 失败，后续循环不再尝试
                  }
                }

                // 如果这一轮循环没有任何一条成功删除，说明遇到了死锁或顽固记录，直接跳出当前仓库
                if (successCount === 0) {
                  console.log(`  ⚠️ 仓库 ${repoName} 存在无法删除的记录，跳过该仓库继续其他仓库。`);
                  break;
                }
              }

              if (deletedInRepo > 0) {
                console.log(`✅ 仓库 ${repoName} 清理完成，共删除 ${deletedInRepo} 条记录。`);
              } else {
                console.log(`✨ 仓库 ${repoName} 记录无需清理或已跳过。`);
              }
            }

            console.log('\n🎉 所有仓库的历史记录清理完成！');
