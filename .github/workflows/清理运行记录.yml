name: '清理运行记录'  # Global Workflow Runs Cleaner

on:
  schedule:
    - cron: '0 0 * * *' # 每天凌晨自动清理所有仓库
  workflow_dispatch:      # 支持手动一键触发清理

jobs:
  clean-all:
    runs-on: ubuntu-latest
    permissions:          # 赋予写入权限以便自动提交保活文件
      contents: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4   # 检出代码

      - name: Delete old runs across all repos
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.MY_GLOBAL_PAT }}
          script: |
            // 保留记录条数
            const keepMinimumRuns = 5;
            const sleep = (ms) => new Promise((resolve) => setTimeout(resolve, ms));

            /* ==============================================================
             * 【未来恢复 3 天限制】：取消下面 2 行注释即可
             * ============================================================== */
            // const daysToKeep = 3;
            // const cutoff = Date.now() - (daysToKeep * 24 * 60 * 60 * 1000);

            // 1. 获取当前账号下所有的个人仓库
            const repos = await github.paginate(github.rest.repos.listForAuthenticatedUser, {
              visibility: 'all',
              affiliation: 'owner',
              per_page: 100
            });

            console.log(`获取到 ${repos.length} 个仓库，开始依次检查与清理...`);

            for (const repo of repos) {
              const owner = repo.owner.login;
              const repoName = repo.name;
              console.log(`\n🔍 正在检查仓库: ${owner}/${repoName}`);

              // --------------------------------------------------------------
              // 【清理 Actions 缓存】（释放 Storage 额度的关键）
              // --------------------------------------------------------------
              try {
                const caches = await github.rest.actions.getActionsCacheList({
                  owner: owner,
                  repo: repoName,
                });
                if (caches.data.actions_caches && caches.data.actions_caches.length > 0) {
                  console.log(`  📦 找到 ${caches.data.actions_caches.length} 个缓存，开始清理...`);
                  for (const cache of caches.data.actions_caches) {
                    await github.rest.actions.deleteActionsCacheById({
                      owner: owner,
                      repo: repoName,
                      cache_id: cache.id,
                    });
                  }
                  console.log(`  ✅ 缓存清理完毕！`);
                }
              } catch (err) {
                // 部分仓库可能无缓存或未开启 Actions 权限，直接跳过
              }

              let deletedInRepo = 0;

              while (true) {
                let response;
                try {
                  response = await github.rest.actions.listWorkflowRunsForRepo({
                    owner: owner,
                    repo: repoName,
                    per_page: 100,
                    page: 1
                  });
                } catch (err) {
                  // 如果该仓库没开启 Actions 或权限不足，直接跳过
                  break;
                }

                const runs = response.data.workflow_runs;
                if (!runs || runs.length <= keepMinimumRuns) {
                  break;
                }

                // 取设置条数之后的所有旧记录
                const runsToDelete = runs.slice(keepMinimumRuns);

                /* ==============================================================
                 * 【未来恢复 3 天限制】：取消下面 2 行注释，并将上面这行注释掉
                 * ============================================================== */
                // const runsToDelete = runs.slice(keepMinimumRuns).filter(run => new Date(run.created_at).getTime() < cutoff);
                // if (runsToDelete.length === 0) break;

                for (const run of runsToDelete) {
                  try {
                    await github.rest.actions.deleteWorkflowRun({
                      owner: owner,
                      repo: repoName,
                      run_id: run.id
                    });
                    deletedInRepo++;
                    console.log(`  └─ [${deletedInRepo}] 已删除 ID: ${run.id} (${run.name})`);
                    await sleep(200);
                  } catch (err) {
                    console.error(`  └─ 删除失败 ${run.id}:`, err.message);
                  }
                }
              }

              if (deletedInRepo > 0) {
                console.log(`✅ 仓库 ${repoName} 清理完成，共删除 ${deletedInRepo} 条记录。`);
              } else {
                console.log(`✨ 仓库 ${repoName} 记录无需清理（<= ${keepMinimumRuns} 条）。`);
              }
            }

            console.log('\n🎉 所有仓库的历史记录清理完成！');

      - name: Keepalive Workflow (50 天本地文件检测)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          KEEPALIVE_FILE=".github/keepalive.txt"
          DAYS_THRESHOLD=50
          CURRENT_TIMESTAMP=$(date +%s)
          
          # 检查保活文件是否存在
          if [ -f "$KEEPALIVE_FILE" ]; then
            LAST_DATE=$(cat "$KEEPALIVE_FILE")
            # 解析上一次的日期时间戳
            LAST_TIMESTAMP=$(date -d "$LAST_DATE" +\%s 2>/dev/null \vert{}\vert{} date -j -f "\%Y-\%m-\%d" "$LAST_DATE" +%s 2>/dev/null || echo 0)
          else
            LAST_TIMESTAMP=0
          fi
          
          # 计算相差天数
          DIFF_DAYS=$(( (CURRENT_TIMESTAMP - LAST_TIMESTAMP) / 86400 ))
          echo "距离上次保活提交已过去 $DIFF_DAYS 天（设定阈值：$DAYS_THRESHOLD 天）"
          
          # 超过或等于 50 天（或首次运行）时触发提交
          if [ $DIFF_DAYS -ge$DAYS_THRESHOLD ]; then
            echo "达到 $DAYS_THRESHOLD 天保活条件，开始更新保活文件..."
            date +%Y-%m-%d > "$KEEPALIVE_FILE"
            
            git config --global user.name "github-actions[bot]"
            git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add "$KEEPALIVE_FILE"
            git commit -m "chore: keepalive workflow update [skip ci]"
            git push
            echo "✅ 保活文件已更新并推送！"
          else
            echo "未达到保活间隔天数，本次跳过提交。"
          fi
